name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hooks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: sh -n install.sh && sh -n bin/check-message && sh -n hooks/_dispatch
      - name: Test Git hooks
        run: python3 -m unittest discover -s tests -v
